plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

version = '0.1.0'
group = 'dev.higgs'

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        higgs_villagers {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

tasks.register('compileAudioQueueTest', JavaCompile) {
    source = files('src/client/java/dev/higgs/AudioPlaybackQueue.java',
        'src/client/test/dev/higgs/AudioPlaybackQueueTest.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('audio-queue-test')
}
tasks.register('testAudioQueue', JavaExec) {
    dependsOn 'compileAudioQueueTest'
    classpath = files(layout.buildDirectory.dir('audio-queue-test'))
    mainClass = 'dev.higgs.AudioPlaybackQueueTest'
}
tasks.named('check') { dependsOn 'testAudioQueue' }
tasks.register('compileAudioLevelsTest', JavaCompile) {
    source = files('src/client/java/dev/higgs/AudioLevels.java',
        'src/client/test/dev/higgs/AudioLevelsTest.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('audio-levels-test')
}
tasks.register('testAudioLevels', JavaExec) {
    dependsOn 'compileAudioLevelsTest'
    classpath = files(layout.buildDirectory.dir('audio-levels-test'))
    mainClass = 'dev.higgs.AudioLevelsTest'
}
tasks.named('check') { dependsOn 'testAudioLevels' }

tasks.register('compileMemoryTest', JavaCompile) {
    source = files('src/main/java/dev/higgs/VillagerMemoryStore.java',
        'src/main/java/dev/higgs/VillagerGossip.java',
        'src/main/java/dev/higgs/RumourConversation.java',
        'src/test/dev/higgs/VillagerMemoryTest.java')
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('memory-test')
}
tasks.register('testMemory', JavaExec) {
    dependsOn 'compileMemoryTest'
    classpath = files(layout.buildDirectory.dir('memory-test')) + sourceSets.main.compileClasspath
    mainClass = 'dev.higgs.VillagerMemoryTest'
}
tasks.named('check') { dependsOn 'testMemory' }
